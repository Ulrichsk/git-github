services:
  db:
    image: postgres:16-alpine
    container_name: ticket-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tickets}
      POSTGRES_USER: ${POSTGRES_USER:-tickets}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tickets}
    ports:
      - "5432:5432"
    volumes:
      - ticket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tickets} -d ${POSTGRES_DB:-tickets}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    container_name: ticket-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tickets}
      DB_USERNAME: ${POSTGRES_USER:-tickets}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-tickets}
      CORS_ALLOWED_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ticket-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  ticket_pgdata:
    name: ticket_pgdata
